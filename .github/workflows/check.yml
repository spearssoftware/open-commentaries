name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: just setup
      - run: just check
